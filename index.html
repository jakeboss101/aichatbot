<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local LLM Chat</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --user-msg: #2563eb;
      --bot-msg: #334155;
      --text-color: #f8fafc;
      --input-bg: #0f172a;
      --border-color: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .config-bar {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    #tunnel-url {
      flex: 1;
    }

    #chat-box {
      flex: 1;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    #user-input {
      flex: 1;
    }

    button {
      background-color: var(--user-msg);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>MacBook Air M2 — Local AI Chat</h1>
    <div class="config-bar">
      <input type="text" id="tunnel-url" placeholder="https://your-tunnel.trycloudflare.com" />
    </div>
  </header>

  <div id="chat-box">
    <div class="message bot">Hello! Paste your Cloudflare Tunnel URL at the top and ask me anything.</div>
  </div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Type a message..." onkeydown="if(event.key === 'Enter') sendMessage()" />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    // Load saved URL from localStorage if present
    document.getElementById('tunnel-url').value = localStorage.getItem('cf_tunnel_url') || '';

    // Save URL on change
    document.getElementById('tunnel-url').addEventListener('input', (e) => {
      localStorage.setItem('cf_tunnel_url', e.target.value.trim());
    });

    async function sendMessage() {
      let baseUrl = document.getElementById('tunnel-url').value.trim();
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const chatBox = document.getElementById('chat-box');
      const prompt = inputEl.value.trim();

      if (!prompt) return;
      if (!baseUrl) {
        alert('Please enter your Cloudflare Tunnel URL in the top field.');
        return;
      }

      // Ensure no trailing slash
      baseUrl = baseUrl.replace(/\/$/, "");

      // Append user message
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'message user';
      userMsgDiv.textContent = prompt;
      chatBox.appendChild(userMsgDiv);

      inputEl.value = '';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // Create bot response bubble
      const botMsgDiv = document.createElement('div');
      botMsgDiv.className = 'message bot';
      botMsgDiv.textContent = '...';
      chatBox.appendChild(botMsgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`${baseUrl}/api/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'llama3.2:3b',
            prompt: prompt,
            stream: true
          })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');

          // Process complete lines, keep incomplete chunk in buffer
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);
              if (parsed.response) {
                fullText += parsed.response;
                botMsgDiv.textContent = fullText;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            } catch (e) {
              console.warn('JSON parse skip on partial line', e);
            }
          }
        }

        // Process any remaining text in buffer
        if (buffer.trim()) {
          try {
            const parsed = JSON.parse(buffer);
            if (parsed.response) {
              fullText += parsed.response;
              botMsgDiv.textContent = fullText;
            }
          } catch (e) {}
        }

      } catch (err) {
        botMsgDiv.textContent = `Error connecting to server: ${err.message}`;
        botMsgDiv.style.backgroundColor = '#991b1b';
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
