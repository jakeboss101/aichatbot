<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AI Assistant</title>

  <!-- Marked.js for Markdown & Prism.js for Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #1e2430;
      --sidebar-width: 220px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Permanent Auto-Collapsing Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
      gap: 12px;
      z-index: 20;
      transition: transform 0.3s ease;
    }

    .sidebar.collapsed {
      transform: translateX(calc(-1 * var(--sidebar-width)));
      min-width: 0;
      width: 0;
      padding: 0;
      overflow: hidden;
      border: none;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .new-chat-btn:active {
      transform: scale(0.98);
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      touch-action: manipulation;
    }

    .history-item-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-item-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: color 0.15s, background-color 0.15s;
      border-radius: 4px;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    @media (hover: hover) {
      .history-item:hover {
        background-color: rgba(255, 255, 255, 0.05);
        color: var(--text-main);
      }
      .delete-item-btn:hover {
        color: #ef4444;
        background-color: rgba(239, 68, 68, 0.1);
      }
    }

    .history-item.active {
      background-color: var(--input-bg);
      color: var(--accent-color);
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .delete-all-btn {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .delete-all-btn:hover {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: #ef4444;
    }

    .footer-brand {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Main Workspace Container */
    .app-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-width: 0;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      gap: 15px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Model Selector Dropdown */
    .model-select {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .model-select:focus {
      border-color: var(--accent-color);
    }

    .token-stats-badge {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .token-stats-badge span {
      color: var(--accent-color);
      font-weight: 600;
    }

    .reset-tokens-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .reset-tokens-btn:hover {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: #ef4444;
    }

    /* Chat Area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message {
      max-width: 100%;
      padding: 16px 20px;
      font-size: 1.02rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
      white-space: pre-wrap;
      max-width: 88%;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-radius: 20px 20px 20px 4px;
      padding-left: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }

    .token-speed-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 6px;
      align-self: flex-start;
      margin-top: 4px;
    }

    /* Code Block Formatting */
    .code-block-wrapper {
      background-color: #161b22;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin: 12px 0;
      overflow: hidden;
    }

    .code-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0d1117;
      padding: 8px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      font-family: monospace;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .copy-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .code-block-wrapper pre {
      margin: 0 !important;
      padding: 14px !important;
      background: transparent !important;
      overflow-x: auto;
    }

    .code-block-wrapper code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace !important;
      font-size: 0.9rem !important;
    }

    /* Input Dock */
    .input-wrapper {
      padding: 12px 16px 16px 16px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .input-card {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 10px 12px 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-card:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      resize: none;
      max-height: 120px;
      height: 28px;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.2s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Bottom Right Version Tag */
    .version-tag {
      position: absolute;
      bottom: 6px;
      right: 12px;
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.5;
      font-family: monospace;
      pointer-events: none;
      z-index: 100;
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-width: 200px;
      }
      .sidebar {
        position: absolute;
        height: 100%;
      }
      .sidebar:not(.collapsed) {
        box-shadow: 5px 0 25px rgba(0,0,0,0.5);
      }
    }
  </style>
</head>
<body>

  <!-- Permanent Collapsible Sidebar (Default collapsed) -->
  <aside id="sidebar" class="sidebar collapsed">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Chat
    </button>
    <div id="chat-history-list" class="chat-history-list"></div>
    <div class="sidebar-footer">
      <button class="delete-all-btn" onclick="deleteAllChats()">Delete All Chats</button>
      <div class="footer-brand">Ollama Web Client</div>
    </div>
  </aside>

  <!-- Main Workspace -->
  <div class="app-container">
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="brand">
          <div class="brand-icon"></div>
          <h1>AI Assistant</h1>
        </div>
      </div>
      <div class="header-right">
        <!-- Model Selector Dropdown -->
        <select id="model-select" class="model-select" onchange="changeModel(this.value)">
          <option value="huihui_ai/qwen2.5-abliterate:7b">Qwen 2.5 7B Abliterated</option>
          <option value="hf.co/janhq/Jan-v3.5-4B-gguf:Q4_K_M">Jan v3.5 4B</option>
        </select>
        <div class="token-stats-badge">
          Total Tokens: <span id="total-tokens-display">0</span>
        </div>
        <button class="reset-tokens-btn" onclick="resetTokenCount()" title="Reset Token Count">Reset</button>
      </div>
    </header>

    <div id="chat-box"></div>

    <div class="input-wrapper">
      <div class="input-card">
        <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Version Tag -->
  <div class="version-tag">v1.5.0</div>

  <script>
    const TUNNEL_BASE_URL = "https://flexible-compiler-overnight-certificate.trycloudflare.com";
    const MAX_CONTEXT_CHARS = 24000;

    let selectedModel = localStorage.getItem('app_selected_model') || "huihui_ai/qwen2.5-abliterate:7b";
    document.getElementById('model-select').value = selectedModel;

    function changeModel(val) {
      selectedModel = val;
      localStorage.setItem('app_selected_model', val);
    }

    let sessions = JSON.parse(localStorage.getItem('app_sessions') || '[]');
    let currentSessionId = null;
    let activeController = null;
    let lifetimeTokens = parseInt(localStorage.getItem('app_total_tokens') || '0', 10);

    const chatBox = document.getElementById('chat-box');
    let userScrolledUp = false;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const renderer = new marked.Renderer();
    renderer.code = function(token) {
      const code = (typeof token === 'object' ? token.text : token) || '';
      const language = (typeof token === 'object' ? token.lang : arguments[1]) || 'plaintext';
      const encodedCode = encodeURIComponent(code);
      const safeCode = escapeHtml(code);

      return `
        <div class="code-block-wrapper">
          <div class="code-block-header">
            <span>${language}</span>
            <button class="copy-btn" onclick="copyCode(this, '${encodedCode}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copy
            </button>
          </div>
          <pre><code class="language-${language}">${safeCode}</code></pre>
        </div>
      `;
    };
    marked.setOptions({ renderer: renderer });

    function copyCode(btn, encodedCode) {
      const code = decodeURIComponent(encodedCode);
      navigator.clipboard.writeText(code).then(() => {
        btn.innerHTML = `✓ Copied!`;
        setTimeout(() => {
          btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v2"></path></svg> Copy`;
        }, 2000);
      });
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    chatBox.addEventListener('scroll', () => {
      const threshold = 50;
      const isAtBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight <= threshold;
      userScrolledUp = !isAtBottom;
    });

    const textarea = document.getElementById('user-input');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function updateOverallTokenStats() {
      document.getElementById('total-tokens-display').textContent = lifetimeTokens.toLocaleString();
      localStorage.setItem('app_total_tokens', lifetimeTokens);
    }

    function addTokensToLifetime(text) {
      const estimatedTokens = Math.ceil(text.length / 4);
      lifetimeTokens += estimatedTokens;
      updateOverallTokenStats();
    }

    function resetTokenCount() {
      if (confirm('Are you sure you want to reset your total token count to 0?')) {
        lifetimeTokens = 0;
        updateOverallTokenStats();
      }
    }

    function cleanupEmptySessions() {
      sessions = sessions.filter(s => s.messages && s.messages.length > 0);
    }

    function saveSessions() {
      localStorage.setItem('app_sessions', JSON.stringify(sessions));
      renderSidebar();
    }

    function renderSidebar() {
      const historyList = document.getElementById('chat-history-list');
      historyList.innerHTML = '';

      sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        
        let touchFired = false;

        const handleSelect = () => {
          touchFired = true;
          switchSession(session.id);
          document.getElementById('sidebar').classList.add('collapsed');
        };

        item.addEventListener('touchend', (e) => {
          e.preventDefault();
          handleSelect();
        });

        item.addEventListener('click', () => {
          if (touchFired) {
            touchFired = false;
            return;
          }
          switchSession(session.id);
          document.getElementById('sidebar').classList.add('collapsed');
        });

        const textSpan = document.createElement('span');
        textSpan.className = 'history-item-text';
        textSpan.textContent = session.title || 'Chat Session';

        item.appendChild(textSpan);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-item-btn';
        deleteBtn.title = 'Delete Chat';
        deleteBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
        
        let btnTouchFired = false;

        deleteBtn.addEventListener('touchend', (e) => {
          e.stopPropagation();
          e.preventDefault();
          btnTouchFired = true;
          deleteSession(session.id);
        });

        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          if (btnTouchFired) {
            btnTouchFired = false;
            return;
          }
          deleteSession(session.id);
        };

        item.appendChild(deleteBtn);
        historyList.appendChild(item);
      });
    }

    function deleteSession(id) {
      if (activeController) {
        activeController.abort();
        activeController = null;
      }
      sessions = sessions.filter(s => s.id !== id);
      saveSessions();

      if (sessions.length === 0) {
        startNewChat();
      } else if (currentSessionId === id) {
        currentSessionId = sessions[0].id;
        renderSidebar();
        renderCurrentChat();
      } else {
        renderSidebar();
      }
    }

    function deleteAllChats() {
      if (confirm('Are you sure you want to delete all chat history?')) {
        if (activeController) {
          activeController.abort();
          activeController = null;
        }
        sessions = [];
        localStorage.removeItem('app_sessions');
        startNewChat();
      }
    }

    function startNewChat() {
      if (activeController) {
        activeController.abort();
        activeController = null;
      }
      cleanupEmptySessions();

      const newSession = {
        id: Date.now().toString(),
        title: 'New Chat',
        messages: []
      };
      sessions.unshift(newSession);
      currentSessionId = newSession.id;
      saveSessions();
      renderSidebar();
      renderCurrentChat();

      document.getElementById('sidebar').classList.add('collapsed');
    }

    function switchSession(id) {
      if (id === currentSessionId) return;

      if (activeController) {
        activeController.abort();
        activeController = null;
      }
      cleanupEmptySessions();

      currentSessionId = id;
      userScrolledUp = false;
      saveSessions();
      renderSidebar();
      renderCurrentChat();
    }

    function renderCurrentChat() {
      chatBox.innerHTML = '';

      const session = sessions.find(s => s.id === currentSessionId);
      if (!session || session.messages.length === 0) {
        updateOverallTokenStats();
        return;
      }

      session.messages.forEach((msg) => {
        const row = document.createElement('div');
        row.className = 'message-row';
        if (msg.role === 'user') {
          row.innerHTML = `<div class="message user"></div>`;
          row.querySelector('.message').textContent = msg.content;
        } else {
          let speedTagHtml = msg.speed ? `<div class="token-speed-tag">⚡ ${msg.speed}</div>` : '';
          row.innerHTML = `
            <div class="message bot">
              <div class="response-content"></div>
              ${speedTagHtml}
            </div>
          `;
          row.querySelector('.response-content').innerHTML = marked.parse(msg.content);
        }
        chatBox.appendChild(row);
      });

      Prism.highlightAll();
      scrollToBottom();
      updateOverallTokenStats();
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function getBoundedMessages(messages) {
      let totalChars = 0;
      let bounded = [];
      for (let i = messages.length - 1; i >= 0; i--) {
        const msgLen = messages[i].content.length;
        if (totalChars + msgLen > MAX_CONTEXT_CHARS && bounded.length > 0) break;
        bounded.unshift(messages[i]);
        totalChars += msgLen;
      }
      return bounded;
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const prompt = inputEl.value.trim();

      if (!prompt) return;

      if (activeController) {
        activeController.abort();
        activeController = null;
      }

      if (!currentSessionId) startNewChat();

      let session = sessions.find(s => s.id === currentSessionId);
      if (session.messages.length === 0) {
        session.title = prompt.length > 18 ? prompt.substring(0, 18) + '...' : prompt;
      }

      session.messages.push({ role: 'user', content: prompt });
      addTokensToLifetime(prompt);
      saveSessions();

      const userRow = document.createElement('div');
      userRow.className = 'message-row';
      userRow.innerHTML = `<div class="message user"></div>`;
      userRow.querySelector('.message').textContent = prompt;
      chatBox.appendChild(userRow);

      inputEl.value = '';
      inputEl.style.height = '28px';

      const botRow = document.createElement('div');
      botRow.className = 'message-row';
      botRow.innerHTML = `
        <div class="message bot">
          <div class="response-content">...</div>
        </div>
      `;
      chatBox.appendChild(botRow);
      const responseContent = botRow.querySelector('.response-content');

      userScrolledUp = false;
      scrollToBottom();

      activeController = new AbortController();
      const startTime = performance.now();
      let generatedTokenCount = 0;
      let fullResponse = '';

      try {
        // Send only standard chat messages with no system prompt
        const apiMessages = getBoundedMessages(session.messages).map(m => ({ 
          role: m.role, 
          content: m.content 
        }));

        const response = await fetch(`${TUNNEL_BASE_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: selectedModel,
            messages: apiMessages,
            stream: true
          }),
          signal: activeController.signal
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let streamBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          streamBuffer += decoder.decode(value, { stream: true });
          const lines = streamBuffer.split('\n');
          streamBuffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
              const parsed = JSON.parse(trimmed);
              if (parsed.message && parsed.message.content) {
                const chunk = parsed.message.content;
                fullResponse += chunk;
                const chunkTokens = Math.ceil(chunk.length / 4);
                generatedTokenCount += chunkTokens;
                lifetimeTokens += chunkTokens;
                updateOverallTokenStats();

                responseContent.innerHTML = marked.parse(fullResponse);
                Prism.highlightAllUnder(responseContent);
                
                if (!userScrolledUp) scrollToBottom();
              }
            } catch (e) {}
          }
        }

        if (streamBuffer.trim()) {
          try {
            const parsed = JSON.parse(streamBuffer.trim());
            if (parsed.message && parsed.message.content) {
              fullResponse += parsed.message.content;
              responseContent.innerHTML = marked.parse(fullResponse);
              Prism.highlightAllUnder(responseContent);
              if (!userScrolledUp) scrollToBottom();
            }
          } catch (e) {}
        }

        const endTime = performance.now();
        const durationSec = (endTime - startTime) / 1000;
        const tokensPerSec = durationSec > 0 ? (generatedTokenCount / durationSec).toFixed(1) : '0.0';
        const speedText = `${tokensPerSec} tok/s`;

        const speedTag = document.createElement('div');
        speedTag.className = 'token-speed-tag';
        speedTag.textContent = `⚡ ${speedText}`;
        botRow.querySelector('.message.bot').appendChild(speedTag);

        session.messages.push({
          role: 'assistant',
          content: fullResponse,
          speed: speedText
        });
        saveSessions();

      } catch (err) {
        if (err.name === 'AbortError') {
          if (fullResponse.trim()) {
            session.messages.push({
              role: 'assistant',
              content: fullResponse,
              speed: 'aborted'
            });
            saveSessions();
          } else {
            botRow.remove();
          }
        } else {
          responseContent.textContent = `Connection error: ${err.message}. Check your TUNNEL_BASE_URL.`;
          responseContent.style.color = '#ef4444';
        }
      } finally {
        if (activeController && activeController.signal.aborted === false) {
          activeController = null;
        }
      }
    }

    cleanupEmptySessions();
    updateOverallTokenStats();
    if (sessions.length === 0) {
      startNewChat();
    } else {
      currentSessionId = sessions[0].id;
      renderSidebar();
      renderCurrentChat();
    }
  </script>
</body>
</html>
