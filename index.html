<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JakeBoss AI Assistant</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #1e2430;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar Drawer */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      z-index: 100;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 90;
      display: none;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s, opacity 0.2s;
      flex-shrink: 0;
    }

    .new-chat-btn:active {
      transform: scale(0.98);
    }

    /* Chat History List */
    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .chat-history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .chat-history-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .chat-history-item.active {
      background: var(--input-bg);
      border-color: var(--border-color);
    }

    .chat-title-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .delete-chat-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .delete-chat-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .delete-all-btn {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .delete-all-btn:hover {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .sidebar-info {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      flex-shrink: 0;
    }

    /* Main Container Shell */
    .app-container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header Bar */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .glow-name {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }

    .token-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--input-bg);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      font-variant-numeric: tabular-nums;
    }

    /* Chat Area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message {
      max-width: 88%;
      padding: 16px 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-radius: 20px 20px 20px 4px;
      padding-left: 0;
    }

    /* Input Dock Area */
    .input-wrapper {
      padding: 12px 16px 6px 16px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .input-card {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 10px 12px 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-card:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      resize: none;
      max-height: 120px;
      height: 28px;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.2s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Version Footer */
    .app-footer {
      display: flex;
      justify-content: flex-end;
      padding: 2px 16px 8px 16px;
      background-color: var(--bg-color);
    }

    .version-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    @media (max-width: 850px) {
      .app-container {
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>

  <!-- Slide-out Sidebar -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Start New Chat
    </button>
    <div id="chat-history-list" class="chat-history-list"></div>
    <button id="delete-all-btn" class="delete-all-btn" onclick="deleteAllChats()" style="display: none;">Delete All Chats</button>
    <div class="sidebar-info">
      <p>Click <strong>Start New Chat</strong> to begin a fresh conversation.</p>
    </div>
  </aside>

  <!-- Main App Shell -->
  <div class="app-container">
    <header>
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="brand">
        <div class="brand-icon"></div>
        <h1>AI Assistant by <span class="glow-name">JakeBoss</span></h1>
      </div>

      <div id="token-counter" class="token-counter">Tokens: 0</div>
    </header>

    <div id="chat-box">
      <div class="message-row">
        <div class="message bot">Hello! I am your personal assistant. How can I help you today?</div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-card">
        <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
    <div class="app-footer">
      <span class="version-tag">v1.2.0</span>
    </div>
  </div>

  <script>
    const baseUrl = "https://remote-basis-avatar-mpeg.trycloudflare.com";
    const modelName = "qwen3.5:4b";

    let chats = [];
    let currentChatId = null;
    let isStreaming = false;
    let abortController = null;

    const textarea = document.getElementById('user-input');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function estimateTokens(text) {
      if (!text) return 0;
      return Math.ceil(text.length / 4);
    }

    function updateTokenDisplay() {
      let total = 0;
      chats.forEach(chat => {
        chat.messages.forEach(msg => {
          total += estimateTokens(msg.content);
        });
      });
      document.getElementById('token-counter').textContent = `Tokens: ${total}`;
    }

    function saveChatsToStorage() {
      localStorage.setItem('jakeboss_chats', JSON.stringify(chats));
      localStorage.setItem('jakeboss_currentChatId', currentChatId);
      updateTokenDisplay();
    }

    function loadChatsFromStorage() {
      const saved = localStorage.getItem('jakeboss_chats');
      if (saved) {
        try {
          chats = JSON.parse(saved);
        } catch(e) { chats = []; }
      }
      const savedId = localStorage.getItem('jakeboss_currentChatId');
      if (savedId && chats.some(c => c.id == savedId)) {
        currentChatId = savedId;
        loadChat(currentChatId, false);
      } else if (chats.length > 0) {
        currentChatId = chats[0].id;
        loadChat(currentChatId, false);
      } else {
        startNewChat(false);
      }
      renderSidebarList();
    }

    function cleanupEmptyUnusedChats() {
      chats = chats.filter(chat => chat.messages.length > 1 || chat.id !== currentChatId);
      if (!chats.some(c => c.id === currentChatId)) {
        if (chats.length > 0) {
          currentChatId = chats[0].id;
          loadChat(currentChatId, false);
        } else {
          startNewChat(false);
        }
      }
      saveChatsToStorage();
      renderSidebarList();
    }

    function startNewChat(openSidebar = true) {
      if (isStreaming && abortController) {
        abortController.abort();
        isStreaming = false;
      }

      cleanupEmptyUnusedChats();

      const newId = 'chat_' + Date.now();
      const newChat = {
        id: newId,
        title: 'New Chat',
        messages: [{ role: 'assistant', content: 'Hello! I am your personal assistant. How can I help you today?' }]
      };

      chats.unshift(newChat);
      currentChatId = newId;
      saveChatsToStorage();
      renderSidebarList();
      loadChat(currentChatId, false);

      const inputEl = document.getElementById('user-input');
      inputEl.disabled = false;
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = false;

      if (openSidebar && window.innerWidth <= 850) {
        toggleSidebar();
      }
    }

    function loadChat(chatId, closeMenu = true) {
      if (isStreaming && abortController) {
        abortController.abort();
        isStreaming = false;
      }

      cleanupEmptyUnusedChats();

      currentChatId = chatId;
      saveChatsToStorage();
      renderSidebarList();

      const chat = chats.find(c => c.id === chatId);
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (chat) {
        chat.messages.forEach(msg => {
          const row = document.createElement('div');
          row.className = 'message-row';
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
          msgDiv.textContent = msg.content;
          row.appendChild(msgDiv);
          chatBox.appendChild(row);
        });
      }
      chatBox.scrollTop = chatBox.scrollHeight;

      const inputEl = document.getElementById('user-input');
      inputEl.disabled = false;
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = false;

      if (closeMenu && window.innerWidth <= 850) {
        toggleSidebar();
      }
    }

    function deleteChat(event, chatId) {
      event.stopPropagation();
      if (isStreaming && currentChatId === chatId && abortController) {
        abortController.abort();
        isStreaming = false;
      }

      chats = chats.filter(c => c.id !== chatId);
      if (currentChatId === chatId) {
        if (chats.length > 0) {
          currentChatId = chats[0].id;
          loadChat(currentChatId, false);
        } else {
          startNewChat(false);
        }
      }
      saveChatsToStorage();
      renderSidebarList();
    }

    function deleteAllChats() {
      if (isStreaming && abortController) {
        abortController.abort();
        isStreaming = false;
      }
      chats = [];
      startNewChat(false);
      saveChatsToStorage();
    }

    function renderSidebarList() {
      const listEl = document.getElementById('chat-history-list');
      const deleteAllBtn = document.getElementById('delete-all-btn');
      listEl.innerHTML = '';

      if (chats.length === 0) {
        deleteAllBtn.style.display = 'none';
        return;
      }

      deleteAllBtn.style.display = 'block';

      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-history-item ${chat.id === currentChatId ? 'active' : ''}`;
        item.onclick = () => loadChat(chat.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'chat-title-text';
        titleSpan.textContent = chat.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-chat-btn';
        delBtn.title = 'Delete chat';
        delBtn.onclick = (e) => deleteChat(e, chat.id);
        delBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        listEl.appendChild(item);
      });
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const chatBox = document.getElementById('chat-box');
      const prompt = inputEl.value.trim();

      if (!prompt) return;

      if (isStreaming && abortController) {
        abortController.abort();
        isStreaming = false;
      }

      let activeChat = chats.find(c => c.id === currentChatId);
      if (!activeChat) {
        startNewChat(false);
        activeChat = chats[0];
      }

      if (activeChat.messages.length === 1 && activeChat.messages[0].role === 'assistant') {
        activeChat.title = prompt.length > 25 ? prompt.substring(0, 25) + '...' : prompt;
      }

      activeChat.messages.push({ role: 'user', content: prompt });

      const userRow = document.createElement('div');
      userRow.className = 'message-row';
      userRow.innerHTML = `<div class="message user"></div>`;
      userRow.querySelector('.message').textContent = prompt;
      chatBox.appendChild(userRow);

      inputEl.value = '';
      inputEl.style.height = '28px';

      const botRow = document.createElement('div');
      botRow.className = 'message-row';
      botRow.innerHTML = `<div class="message bot">...</div>`;
      chatBox.appendChild(botRow);
      const botMsgDiv = botRow.querySelector('.message');
      chatBox.scrollTop = chatBox.scrollHeight;

      isStreaming = true;
      abortController = new AbortController();

      try {
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: modelName,
            messages: activeChat.messages,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let streamBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          streamBuffer += decoder.decode(value, { stream: true });
          const lines = streamBuffer.split('\n');
          streamBuffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
              const parsed = JSON.parse(trimmed);
              
              if (parsed.message && parsed.message.thinking) {
                fullText += parsed.message.thinking;
                botMsgDiv.textContent = fullText;
                chatBox.scrollTop = chatBox.scrollHeight;
              }

              if (parsed.message && parsed.message.content) {
                fullText += parsed.message.content;
                botMsgDiv.textContent = fullText;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            } catch (e) {}
          }
        }

        if (streamBuffer.trim()) {
          try {
            const parsed = JSON.parse(streamBuffer.trim());
            if (parsed.message && (parsed.message.content || parsed.message.thinking)) {
              fullText += parsed.message.content || parsed.message.thinking;
              botMsgDiv.textContent = fullText;
            }
          } catch (e) {}
        }

        activeChat.messages.push({ role: 'assistant', content: fullText });
        saveChatsToStorage();
        renderSidebarList();

      } catch (err) {
        if (err.name === 'AbortError') {
          return;
        }
        botMsgDiv.textContent = `Connection error: ${err.message}`;
        botMsgDiv.style.color = '#ef4444';
      } finally {
        isStreaming = false;
        abortController = null;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadChatsFromStorage();
    });
  </script>
</body>
</html>
