<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen 2.5 Uncensored - AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --user-msg: #2563eb;
            --bot-msg: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --accent-color: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 900px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .badge {
            background-color: #059669;
            color: white;
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 900px;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .message .sender {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            display: block;
        }

        #input-container {
            width: 100%;
            max-width: 900px;
            padding: 1rem;
            display: flex;
            gap: 0.5rem;
            background-color: var(--bg-color);
        }

        textarea {
            flex: 1;
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 0.95rem;
            resize: none;
            height: 52px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .system-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            padding: 0.5rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Qwen 2.5 Abliterated (7B)</h1>
        <span class="badge">Online</span>
    </header>

    <div id="chat-container">
        <div class="message bot">
            <span class="sender">Assistant</span>
            Connected! Type your prompt below to start chatting.
        </div>
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="Type your message here... (Press Enter to send, Shift+Enter for new line)" rows="1"></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <div class="system-status">
        Powered by local Ollama instance via secure tunnel
    </div>

    <script>
        // ==========================================
        // CONFIGURATION SECTION (Edit URL here)
        // ==========================================
        const API_ENDPOINT = 'https://identifies-classic-famous-explicit.trycloudflare.com';
        const MODEL_NAME = 'huihui_ai/qwen2.5-abliterate:7b';
        // ==========================================
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Allow Enter to send, Shift+Enter for new lines
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Render User Message
            appendMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Create Bot Message Element for Streaming
            const botMessageElem = appendMessage('bot', '');
            
            try {
                // Ensure no trailing slash on the base endpoint URL
                const baseUrl = API_ENDPOINT.endsWith('/') ? API_ENDPOINT.slice(0, -1) : API_ENDPOINT;

                const response = await fetch(`${baseUrl}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        prompt: text,
                        options: {
                            num_ctx: 4096 
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned error: ${response.status} ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.trim()) {
                            const parsed = JSON.parse(line);
                            if (parsed.response) {
                                fullText += parsed.response;
                                botMessageElem.innerText = fullText;
                                chatContainer.scrollTop = chatContainer.scrollHeight;
                            }
                        }
                    }
                }
            } catch (err) {
                botMessageElem.innerText = `Error connecting to backend endpoint.\n\nDetails: ${err.message}`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            
            const senderSpan = document.createElement('span');
            senderSpan.classList.add('sender');
            senderSpan.innerText = sender === 'user' ? 'You' : 'Assistant';

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(document.createTextNode(text));

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return msgDiv;
        }
    </script>
</body>
</html>
