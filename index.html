<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JakeBoss AI Assistant</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-thinking: #6b7280;
      --input-bg: #1e2430;
      --danger-color: #ef4444;
      --sidebar-width: 200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 25;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 12px;
      z-index: 30;
      transition: transform 0.25s ease;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .history-item.active {
      background-color: var(--input-bg);
      color: var(--accent-color);
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      border-radius: 4px;
      opacity: 0.6;
    }

    .history-item:hover .delete-chat-btn {
      opacity: 1;
    }

    .delete-chat-btn:hover {
      color: var(--danger-color);
      background-color: rgba(239, 68, 68, 0.15);
    }

    .delete-all-btn {
      width: 100%;
      background: transparent;
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sidebar-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .app-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .glow-name {
      color: var(--accent-color);
    }

    .token-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--input-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .token-counter span {
      color: var(--accent-color);
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message {
      max-width: 88%;
      padding: 16px 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-radius: 20px 20px 20px 4px;
      padding-left: 0;
    }

    .thinking-block {
      color: var(--text-thinking);
      font-style: italic;
      font-size: 0.95rem;
      border-left: 3px solid var(--border-color);
      padding-left: 12px;
      margin-bottom: 12px;
    }

    .thinking-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-style: normal;
    }

    .input-wrapper {
      padding: 12px 16px 16px 16px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .input-card {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-card:focus-within {
      border-color: var(--accent-color);
    }

    .input-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 8px;
      border-right: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-text {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 28px;
      height: 16px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border-color);
      border-radius: 20px;
      transition: .2s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 10px;
      width: 10px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .2s;
    }

    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(12px); background-color: #0f172a; }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      resize: none;
      height: 28px;
      line-height: 1.4;
    }

    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .send-btn.stop { background: var(--danger-color); color: #ffffff; }
    .send-btn svg { width: 20px; height: 20px; fill: currentColor; }

    @media (max-width: 768px) {
      .menu-toggle-btn { display: flex; }
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 240px;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .toggle-text { display: none; }
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
    <div id="chat-history-list" class="chat-history-list"></div>
    <button id="delete-all-btn" class="delete-all-btn" onclick="deleteAllChats()">Delete All</button>
    <div class="sidebar-footer">JakeBoss AI</div>
  </aside>

  <div class="app-container">
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
        <div class="brand">
          <div class="brand-icon"></div>
          <h1>AI Assistant by <span class="glow-name">JakeBoss</span></h1>
        </div>
      </div>
      <div class="token-counter">Tokens: <span id="total-tokens">0</span></div>
    </header>

    <div id="chat-box"></div>

    <div class="input-wrapper">
      <div class="input-card">
        <div class="input-controls">
          <div class="control-group">
            <span class="toggle-text">Think</span>
            <label class="switch">
              <input type="checkbox" id="thinking-toggle" onchange="enableThinking = this.checked; localStorage.setItem('jakeboss_enable_thinking', enableThinking);">
              <span class="slider"></span>
            </label>
          </div>
          <div class="control-group">
            <span class="toggle-text">Web</span>
            <label class="switch">
              <input type="checkbox" id="search-toggle" onchange="enableSearch = this.checked; localStorage.setItem('jakeboss_enable_search', enableSearch);">
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleSendClick();}"></textarea>
        <button id="send-btn" class="send-btn" onclick="handleSendClick()">
          <svg id="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = "https://recycling-belts-paperback-jazz.trycloudflare.com";
    const modelName = "qwen3.5:4b";

    let sessions = JSON.parse(localStorage.getItem('jakeboss_sessions') || '[]');
    let totalTokens = parseInt(localStorage.getItem('jakeboss_total_tokens') || '0', 10);
    let enableThinking = JSON.parse(localStorage.getItem('jakeboss_enable_thinking') ?? 'false');
    let enableSearch = JSON.parse(localStorage.getItem('jakeboss_enable_search') ?? 'false');
    let currentSessionId = null;
    let abortController = null;
    let isGenerating = false;
    let userScrolledUp = false;

    document.getElementById('thinking-toggle').checked = enableThinking;
    document.getElementById('search-toggle').checked = enableSearch;

    const chatBoxEl = document.getElementById('chat-box');
    chatBoxEl.addEventListener('scroll', () => {
      const threshold = 50;
      const isAtBottom = chatBoxEl.scrollHeight - chatBoxEl.scrollTop - chatBoxEl.clientHeight <= threshold;
      userScrolledUp = !isAtBottom;
    });

    function scrollToBottomIfNeeded() {
      if (!userScrolledUp) {
        chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    }

    function updateTotalTokensDisplay() {
      document.getElementById('total-tokens').textContent = totalTokens.toLocaleString();
      localStorage.setItem('jakeboss_total_tokens', totalTokens.toString());
    }

    function renderSidebar() {
      const historyList = document.getElementById('chat-history-list');
      historyList.innerHTML = '';
      sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        item.onclick = () => { currentSessionId = session.id; renderSidebar(); renderCurrentChat(); closeSidebar(); };
        item.innerHTML = `<span class="history-title">${session.title || 'Chat'}</span><button class="delete-chat-btn" onclick="event.stopPropagation(); deleteChat('${session.id}')">×</button>`;
        historyList.appendChild(item);
      });
    }

    function deleteChat(id) {
      sessions = sessions.filter(s => s.id !== id);
      localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));
      if (currentSessionId === id) startNewChat();
      else renderSidebar();
    }

    function deleteAllChats() {
      sessions = [];
      localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));
      startNewChat();
    }

    function startNewChat() {
      if (abortController) abortController.abort();
      const newSession = { id: Date.now().toString(), title: 'New Chat', messages: [] };
      sessions.unshift(newSession);
      currentSessionId = newSession.id;
      localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));
      renderSidebar();
      renderCurrentChat();
      closeSidebar();
    }

    function renderCurrentChat() {
      chatBoxEl.innerHTML = '';
      const session = sessions.find(s => s.id === currentSessionId);
      if (!session || session.messages.length === 0) {
        chatBoxEl.innerHTML = `<div class="message-row"><div class="message bot"><div class="response-content">Hello! I am your personal assistant. How can I help you today?</div></div></div>`;
        return;
      }
      session.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = 'message-row';
        if (msg.role === 'user') {
          row.innerHTML = `<div class="message user"></div>`;
          row.querySelector('.message').textContent = msg.content;
        } else {
          row.innerHTML = `<div class="message bot">${msg.thinking ? `<div class="thinking-block"><div class="thinking-label">Thinking...</div>${msg.thinking}</div>` : ''}<div class="response-content"></div></div>`;
          row.querySelector('.response-content').textContent = msg.content;
        }
        chatBoxEl.appendChild(row);
      });
      userScrolledUp = false;
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;
    }

    function handleSendClick() {
      const inputEl = document.getElementById('user-input');
      const prompt = inputEl.value.trim();
      if (!prompt) return;

      if (isGenerating && abortController) {
        abortController.abort();
        return;
      }

      sendMessage(prompt);
    }

    async function getUserLocation() {
      try {
        const ipRes = await fetch('https://ipapi.co/json/');
        if (ipRes.ok) {
          const ipData = await ipRes.json();
          const locationParts = [ipData.city, ipData.region, ipData.country_name].filter(Boolean);
          if (locationParts.length > 0) {
            return locationParts.join(', ');
          }
        }
      } catch (e) {}

      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve("Location Unavailable");
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            try {
              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
              const data = await res.json();
              const addr = data.address || {};
              const city = addr.city || addr.town || addr.village || addr.hamlet || "";
              const state = addr.state || "";
              const country = addr.country || "";
              const formattedLoc = [city, state, country].filter(Boolean).join(", ");
              resolve(formattedLoc || "Location Unavailable");
            } catch (e) {
              resolve("Location Unavailable");
            }
          },
          () => resolve("Location Denied/Unavailable"),
          { timeout: 5000 }
        );
      });
    }

    async function sendMessage(prompt) {
      const inputEl = document.getElementById('user-input');
      const session = sessions.find(s => s.id === currentSessionId);

      if (session.messages.length === 0) {
        session.title = prompt.length > 18 ? prompt.substring(0, 18) + '...' : prompt;
      }

      session.messages.push({ role: 'user', content: prompt });
      localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));
      renderSidebar();

      const userRow = document.createElement('div');
      userRow.className = 'message-row';
      userRow.innerHTML = `<div class="message user"></div>`;
      userRow.querySelector('.message').textContent = prompt;
      chatBoxEl.appendChild(userRow);

      inputEl.value = '';

      const botRow = document.createElement('div');
      botRow.className = 'message-row';
      botRow.innerHTML = `
        <div class="message bot">
          <div class="thinking-block" style="display: none;">
            <div class="thinking-label">Thinking...</div>
            <span class="thinking-content"></span>
          </div>
          <div class="response-content"></div>
        </div>
      `;
      chatBoxEl.appendChild(botRow);

      const thinkingBlock = botRow.querySelector('.thinking-block');
      const thinkingContent = botRow.querySelector('.thinking-content');
      const responseContent = botRow.querySelector('.response-content');

      userScrolledUp = false;
      chatBoxEl.scrollTop = chatBoxEl.scrollHeight;

      abortController = new AbortController();
      isGenerating = true;
      const sendBtn = document.getElementById('send-btn');
      sendBtn.classList.add('stop');

      const now = new Date();
      const dateStr = now.toLocaleDateString();
      const timeStr = now.toLocaleTimeString();
      const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const locationDetails = await getUserLocation();

      const systemMessage = {
        role: "system",
        content: `User Context:\n- Current Date: ${dateStr}\n- Current Time: ${timeStr} (${timeZone})\n- Current Location: ${locationDetails}`
      };

      const payloadMessages = [
        systemMessage,
        ...session.messages.map(m => ({ role: m.role, content: m.content }))
      ];

      let fullThinking = '';
      let fullResponse = '';

      try {
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: modelName,
            messages: payloadMessages,
            think: enableThinking,
            search: enableSearch,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);

              if (parsed.message?.thinking) {
                fullThinking += parsed.message.thinking;
                thinkingBlock.style.display = 'block';
                thinkingContent.textContent = fullThinking;
              }

              if (parsed.message?.content) {
                fullResponse += parsed.message.content;
                responseContent.textContent = fullResponse;
              }

              if (parsed.done) {
                totalTokens += (parsed.prompt_eval_count || 0) + (parsed.eval_count || 0);
                updateTotalTokensDisplay();
              }
              scrollToBottomIfNeeded();
            } catch (err) {}
          }
        }

        session.messages.push({ role: 'assistant', content: fullResponse, thinking: fullThinking });
        localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));

      } catch (err) {
        if (err.name !== 'AbortError') {
          responseContent.textContent = `Error connecting to model: ${err.message}`;
          responseContent.style.color = 'var(--danger-color)';
        }
      } finally {
        isGenerating = false;
        sendBtn.classList.remove('stop');
        abortController = null;
      }
    }

    updateTotalTokensDisplay();
    if (sessions.length === 0) startNewChat();
    else { currentSessionId = sessions[0].id; renderSidebar(); renderCurrentChat(); }
  </script>
</body>
</html>
