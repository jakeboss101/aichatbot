<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakeBoss AI Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar styling for dark mode */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex flex-col antialiased overflow-hidden">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <button id="sidebar-toggle" class="text-gray-400 hover:text-white focus:outline-none md:hidden">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            <div class="flex items-center space-x-2">
                <i data-lucide="bot" class="w-7 h-7 text-indigo-400"></i>
                <h1 class="text-xl font-bold tracking-wide text-white">JakeBoss AI</h1>
            </div>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <div class="hidden sm:flex items-center space-x-2 bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-700">
                <i data-lucide="cpu" class="w-4 h-4 text-indigo-400"></i>
                <span class="text-gray-400">Tokens:</span>
                <span id="token-counter" class="font-mono text-indigo-300 font-semibold">0</span>
            </div>
            <button id="new-chat-btn" class="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition-colors font-medium shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>New Chat</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 relative overflow-hidden">

        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-20 hidden md:hidden"></div>

        <!-- Sidebar (Session Management) -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-64 bg-gray-800/95 md:bg-gray-800 border-r border-gray-700 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
            <div class="p-3 border-b border-gray-700 flex justify-between items-center">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Chat History</span>
                <button id="close-sidebar-btn" class="text-gray-400 hover:text-white md:hidden">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="session-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Dynamic sessions rendered here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col bg-gray-900 relative min-w-0">
            
            <!-- Message Feed -->
            <div id="message-feed" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Dynamic messages rendered here -->
            </div>

            <!-- Controls & Input Area -->
            <div class="p-4 border-t border-gray-800 bg-gray-900/80 backdrop-blur-md">
                <div class="max-w-4xl mx-auto space-y-3">
                    
                    <!-- Feature Toggles -->
                    <div class="flex items-center space-x-6 text-xs text-gray-400 font-medium px-1">
                        <label class="flex items-center space-x-2 cursor-pointer select-none group">
                            <input type="checkbox" id="web-search-toggle" class="sr-only peer" checked>
                            <div class="w-8 h-4 bg-gray-700 rounded-full peer peer-checked:bg-indigo-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all relative"></div>
                            <span class="group-hover:text-gray-200 transition-colors flex items-center space-x-1">
                                <i data-lucide="globe" class="w-3.5 h-3.5 text-indigo-400"></i>
                                <span>Web Search</span>
                            </span>
                        </label>

                        <label class="flex items-center space-x-2 cursor-pointer select-none group">
                            <input type="checkbox" id="reasoning-toggle" class="sr-only peer" checked>
                            <div class="w-8 h-4 bg-gray-700 rounded-full peer peer-checked:bg-indigo-600 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all relative"></div>
                            <span class="group-hover:text-gray-200 transition-colors flex items-center space-x-1">
                                <i data-lucide="brain" class="w-3.5 h-3.5 text-indigo-400"></i>
                                <span>Show Reasoning</span>
                            </span>
                        </label>
                    </div>

                    <!-- Input Box -->
                    <div class="flex items-end space-x-2 bg-gray-800 border border-gray-700 rounded-xl p-2 focus-within:border-indigo-500 focus-within:ring-1 focus-within:ring-indigo-500 transition-all shadow-lg">
                        <textarea id="chat-input" rows="1" placeholder="Type your message..." class="flex-1 bg-transparent text-gray-100 placeholder-gray-500 border-none resize-none focus:outline-none max-h-32 p-1 text-sm md:text-base leading-relaxed"></textarea>
                        <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:hover:bg-indigo-600 text-white p-2 rounded-lg transition-colors shrink-0">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- Application JavaScript -->
    <script>
        // Configuration Constants
        const CONFIG = {
            OLLAMA_ENDPOINT: 'https://oecd-resume-jim-practice.trycloudflare.com',
            MODEL_NAME: 'qwen3.5:4b',
            DDG_SEARCH_ENDPOINT: 'https://html.duckduckgo.com/html/?q=',
            WIKI_SEARCH_ENDPOINT: 'https://en.wikipedia.org/w/api.php'
        };

        // State Management
        let sessions = JSON.parse(localStorage.getItem('jakeboss_sessions')) || [];
        let currentSessionId = localStorage.getItem('jakeboss_current_session_id') || null;
        let cumulativeTokens = parseInt(localStorage.getItem('jakeboss_cumulative_tokens')) || 0;
        let isGenerating = false;

        // Initialize Lucide Icons
        lucide.createIcons();

        // DOM Elements
        const elements = {
            sidebar: document.getElementById('sidebar'),
            sidebarToggle: document.getElementById('sidebar-toggle'),
            closeSidebarBtn: document.getElementById('close-sidebar-btn'),
            mobileOverlay: document.getElementById('mobile-overlay'),
            sessionList: document.getElementById('session-list'),
            messageFeed: document.getElementById('message-feed'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            newChatBtn: document.getElementById('new-chat-btn'),
            tokenCounter: document.getElementById('token-counter'),
            webSearchToggle: document.getElementById('web-search-toggle'),
            reasoningToggle: document.getElementById('reasoning-toggle')
        };

        // App Initialization
        function init() {
            updateTokenDisplay();
            if (sessions.length === 0) {
                createNewSession();
            } else {
                if (!currentSessionId || !sessions.find(s => s.id === currentSessionId)) {
                    currentSessionId = sessions[0].id;
                }
                renderSessions();
                renderMessages();
            }
            setupEventListeners();
        }

        // Event Listeners Setup
        function setupEventListeners() {
            // Sidebar Toggles
            elements.sidebarToggle.addEventListener('click', toggleMobileSidebar);
            elements.closeSidebarBtn.addEventListener('click', toggleMobileSidebar);
            elements.mobileOverlay.addEventListener('click', toggleMobileSidebar);

            // New Chat
            elements.newChatBtn.addEventListener('click', () => {
                createNewSession();
                if (window.innerWidth < 768) toggleMobileSidebar();
            });

            // Chat Input Auto-resize & Keypress
            elements.chatInput.addEventListener('input', autoResizeTextarea);
            elements.chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSendMessage();
                }
            });

            // Send Button
            elements.sendBtn.addEventListener('click', handleSendMessage);
        }

        // Sidebar Responsive Logic
        function toggleMobileSidebar() {
            const isHidden = elements.sidebar.classList.contains('-translate-x-full');
            if (isHidden) {
                elements.sidebar.classList.remove('-translate-x-full');
                elements.mobileOverlay.classList.remove('hidden');
            } else {
                elements.sidebar.classList.add('-translate-x-full');
                elements.mobileOverlay.classList.add('hidden');
            }
        }

        function autoResizeTextarea() {
            elements.chatInput.style.height = 'auto';
            elements.chatInput.style.height = `${Math.min(elements.chatInput.scrollHeight, 128)}px`;
        }

        // Token Counter Handling
        function updateTokenDisplay() {
            elements.tokenCounter.textContent = cumulativeTokens.toLocaleString();
            localStorage.setItem('jakeboss_cumulative_tokens', cumulativeTokens);
        }

        // Session Management
        function createNewSession() {
            const newSession = {
                id: 'session_' + Date.now(),
                title: 'New Conversation',
                timestamp: Date.now(),
                messages: []
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessions();
            renderSessions();
            renderMessages();
        }

        function saveSessions() {
            localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));
            localStorage.setItem('jakeboss_current_session_id', currentSessionId);
        }

        function getCurrentSession() {
            return sessions.find(s => s.id === currentSessionId);
        }

        function deleteSession(sessionId, e) {
            e.stopPropagation();
            sessions = sessions.filter(s => s.id !== sessionId);
            if (sessions.length === 0) {
                createNewSession();
            } else {
                if (currentSessionId === sessionId) {
                    currentSessionId = sessions[0].id;
                }
                saveSessions();
                renderSessions();
                renderMessages();
            }
        }

        function renderSessions() {
            elements.sessionList.innerHTML = '';
            sessions.forEach(session => {
                const isActive = session.id === currentSessionId;
                const sessionEl = document.createElement('div');
                sessionEl.className = `flex items-center justify-between p-2.5 rounded-lg cursor-pointer transition-colors group ${
                    isActive ? 'bg-indigo-600/20 text-indigo-300 border border-indigo-500/30' : 'text-gray-300 hover:bg-gray-700/50'
                }`;
                sessionEl.onclick = () => {
                    currentSessionId = session.id;
                    saveSessions();
                    renderSessions();
                    renderMessages();
                    if (window.innerWidth < 768) toggleMobileSidebar();
                };

                sessionEl.innerHTML = `
                    <div class="flex items-center space-x-2 min-w-0 flex-1">
                        <i data-lucide="message-square" class="w-4 h-4 shrink-0 ${isActive ? 'text-indigo-400' : 'text-gray-400'}"></i>
                        <span class="text-sm truncate font-medium">${escapeHtml(session.title)}</span>
                    </div>
                    <button class="delete-session-btn text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity p-1" title="Delete Session">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                `;

                sessionEl.querySelector('.delete-session-btn').onclick = (e) => deleteSession(session.id, e);
                elements.sessionList.appendChild(sessionEl);
            });
            lucide.createIcons();
        }

        // Message Rendering
        function renderMessages() {
            elements.messageFeed.innerHTML = '';
            const session = getCurrentSession();
            if (!session || session.messages.length === 0) {
                elements.messageFeed.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center text-gray-500 space-y-3">
                        <i data-lucide="bot" class="w-12 h-12 text-gray-600"></i>
                        <p class="text-base font-medium">How can JakeBoss assist you today?</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            session.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.content, msg.thinking, false);
            });
            scrollToBottom();
        }

        function appendMessageToDOM(role, content = '', thinking = '', isStreaming = false) {
            const isUser = role === 'user';
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex space-x-3 max-w-4xl mx-auto ${isUser ? 'justify-end' : 'justify-start'}`;

            const avatarHtml = isUser ? `
                <div class="w-8 h-8 rounded-lg bg-gray-700 flex items-center justify-center text-white shrink-0 order-2 ml-3">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
            ` : `
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shrink-0 order-1 mr-3">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                </div>
            `;

            const showThinking = elements.reasoningToggle.checked && thinking;

            const contentHtml = `
                <div class="flex-1 min-w-0 ${isUser ? 'order-1 text-right' : 'order-2'}">
                    ${!isUser && showThinking ? `
                        <details class="mb-2 bg-gray-800/60 rounded-lg border border-gray-700/50 overflow-hidden text-left" ${isStreaming ? 'open' : ''}>
                            <summary class="px-3 py-1.5 text-xs font-semibold text-gray-400 bg-gray-800 cursor-pointer flex items-center space-x-1.5 hover:text-gray-200">
                                <i data-lucide="brain" class="w-3.5 h-3.5 text-indigo-400"></i>
                                <span>Reasoning Process</span>
                            </summary>
                            <div class="p-3 text-xs text-gray-400 font-mono leading-relaxed border-t border-gray-700/30 whitespace-pre-wrap thinking-content">${escapeHtml(thinking)}</div>
                        </details>
                    ` : ''}
                    <div class="inline-block rounded-2xl px-4 py-2.5 text-sm md:text-base leading-relaxed ${
                        isUser 
                            ? 'bg-indigo-600 text-white rounded-tr-none text-left' 
                            : 'bg-gray-800 text-gray-100 rounded-tl-none border border-gray-700/50 text-left'
                    }">
                        <div class="message-text whitespace-pre-wrap">${escapeHtml(content)}</div>
                    </div>
                </div>
            `;

            messageWrapper.innerHTML = isUser ? contentHtml + avatarHtml : avatarHtml + contentHtml;
            elements.messageFeed.appendChild(messageWrapper);
            lucide.createIcons();
            
            return messageWrapper;
        }

        function scrollToBottom() {
            elements.messageFeed.scrollTop = elements.messageFeed.scrollHeight;
        }

        // Search Integration
        async function fetchSearchContext(query) {
            let context = '';
            
            // Wikipedia Fetch
            try {
                const wikiUrl = `${CONFIG.WIKI_SEARCH_ENDPOINT}?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const wikiRes = await fetch(wikiUrl);
                const wikiData = await wikiRes.json();
                
                if (wikiData.query && wikiData.query.search.length > 0) {
                    const topResults = wikiData.query.search.slice(0, 2);
                    context += 'Wikipedia Results:\n';
                    topResults.forEach(res => {
                        const cleanSnippet = res.snippet.replace(/<[^>]*>?/gm, '');
                        context += `- ${res.title}: ${cleanSnippet}\n`;
                    });
                }
            } catch (err) {
                console.warn('Wikipedia search failed:', err);
            }

            // DuckDuckGo Proxy Fetch
            try {
                const ddgUrl = `https://corsproxy.io/?${encodeURIComponent(CONFIG.DDG_SEARCH_ENDPOINT + encodeURIComponent(query))}`;
                const ddgRes = await fetch(ddgUrl);
                const ddgHtml = await ddgRes.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(ddgHtml, 'text/html');
                const snippets = doc.querySelectorAll('.result__snippet');
                
                if (snippets.length > 0) {
                    context += '\nWeb Results:\n';
                    Array.from(snippets).slice(0, 3).forEach(snip => {
                        context += `- ${snip.textContent.trim()}\n`;
                    });
                }
            } catch (err) {
                console.warn('DuckDuckGo search failed:', err);
            }

            return context.trim();
        }

        // Send & Stream Logic
        async function handleSendMessage() {
            const input = elements.chatInput.value.trim();
            if (!input || isGenerating) return;

            const session = getCurrentSession();
            if (!session) return;

            // First message sets title
            if (session.messages.length === 0) {
                session.title = input.slice(0, 30) + (input.length > 30 ? '...' : '');
                renderSessions();
            }

            // Append User Message
            session.messages.push({ role: 'user', content: input });
            saveSessions();
            
            elements.chatInput.value = '';
            autoResizeTextarea();
            renderMessages();

            isGenerating = true;
            elements.sendBtn.disabled = true;

            // Search Enrichment
            let preparedInput = input;
            if (elements.webSearchToggle.checked) {
                const searchContext = await fetchSearchContext(input);
                if (searchContext) {
                    preparedInput = `[Web Search Context]\n${searchContext}\n\n[User Query]\n${input}`;
                }
            }

            // Prepare API Messages Array
            const apiMessages = session.messages.map((msg, index) => {
                if (index === session.messages.length - 1 && msg.role === 'user') {
                    return { role: 'user', content: preparedInput };
                }
                return { role: msg.role, content: msg.content };
            });

            // UI Placeholder for Assistant Streaming
            const messageEl = appendMessageToDOM('assistant', '', '', true);
            const messageTextNode = messageEl.querySelector('.message-text');
            let thinkingContentNode = messageEl.querySelector('.thinking-content');

            let assistantContent = '';
            let assistantThinking = '';
            let isThinkingBlock = false;

            try {
                const response = await fetch(CONFIG.OLLAMA_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: CONFIG.MODEL_NAME,
                        messages: apiMessages,
                        stream: true
                    })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);
                            const token = data.message?.content || '';

                            // Parse <think> tags dynamically
                            if (token.includes('<think>')) {
                                isThinkingBlock = true;
                                continue;
                            }
                            if (token.includes('</think>')) {
                                isThinkingBlock = false;
                                continue;
                            }

                            if (isThinkingBlock) {
                                assistantThinking += token;
                                if (thinkingContentNode) {
                                    thinkingContentNode.textContent = assistantThinking;
                                }
                            } else {
                                assistantContent += token;
                                messageTextNode.textContent = assistantContent;
                            }

                            // Capture usage stats if provided by Ollama
                            if (data.eval_count) {
                                cumulativeTokens += data.eval_count;
                                updateTokenDisplay();
                            }

                            scrollToBottom();
                        } catch (err) {
                            console.error('Error parsing JSON chunk:', err);
                        }
                    }
                }

                // Append complete message to state
                session.messages.push({
                    role: 'assistant',
                    content: assistantContent,
                    thinking: assistantThinking
                });
                saveSessions();

            } catch (err) {
                console.error('Stream failure:', err);
                messageTextNode.textContent = 'Error connecting to JakeBoss AI assistant. Please try again.';
            } finally {
                isGenerating = false;
                elements.sendBtn.disabled = false;
            }
        }

        // Utility: HTML Escaping
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Run application
        init();
    </script>
</body>
</html>
