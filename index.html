<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JakeBoss AI Assistant</title>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for code block highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-thinking: #6b7280;
      --input-bg: #1e2430;
      --danger-color: #ef4444;
      --sidebar-width: 200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    body {
      display: flex;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 25;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 12px;
      z-index: 30;
      transition: transform 0.25s ease;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .history-item.active {
      background-color: var(--input-bg);
      color: var(--accent-color);
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      opacity: 0.6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-chat-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .history-item:hover .delete-chat-btn { opacity: 1; }
    .delete-chat-btn:hover {
      color: var(--danger-color);
      background-color: rgba(239, 68, 68, 0.15);
    }

    .delete-all-btn {
      width: 100%;
      background: transparent;
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sidebar-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .app-container {
      flex: 1;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-size: 1.2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
    }

    h1 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .glow-name { color: var(--accent-color); }

    .token-counter {
      font-size: 0.8rem;
