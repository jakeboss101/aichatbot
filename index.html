<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JakeBoss AI Assistant</title>
  
  <!-- Markdown & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-thinking: #6b7280;
      --input-bg: #1e2430;
      --danger-color: #ef4444;
      --sidebar-width: 240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 25;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.active {
      display: block;
      opacity: 1;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px 10px;
      gap: 12px;
      z-index: 30;
      transition: transform 0.25s ease;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .new-chat-btn:hover { opacity: 0.9; }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background-color 0.15s ease;
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .history-item.active {
      background-color: var(--input-bg);
      color: var(--accent-color);
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0.6;
    }

    .history-item:hover .delete-chat-btn { opacity: 1; }

    .delete-chat-btn:hover {
      color: var(--danger-color);
      background-color: rgba(239, 68, 68, 0.15);
    }

    .delete-all-btn {
      width: 100%;
      background: transparent;
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .delete-all-btn:hover { background-color: rgba(239, 68, 68, 0.1); }

    .sidebar-footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    /* Main Container */
    .app-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .glow-name { color: var(--accent-color); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .token-counter {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--input-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .token-counter span { color: var(--accent-color); }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message {
      max-width: 88%;
      padding: 14px 18px;
      font-size: 1rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
      white-space: pre-wrap;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-radius: 20px 20px 20px 4px;
      padding-left: 0;
      width: 100%;
    }

    .response-content p { margin-bottom: 0.8em; }
    .response-content p:last-child { margin-bottom: 0; }
    .response-content code {
      background: var(--input-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }
    .response-content pre {
      background: #0d1117;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid var(--border-color);
    }
    .response-content pre code { background: transparent; padding: 0; }

    .thinking-block {
      color: var(--text-thinking);
      font-style: italic;
      font-size: 0.9rem;
      border-left: 3px solid var(--border-color);
      padding-left: 12px;
      margin-bottom: 12px;
    }

    .thinking-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-style: normal;
    }

    /* Input Controls */
    .input-wrapper {
      padding: 12px 16px 16px 16px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    /* Features Bar (Toggles) */
    .features-bar {
      max-width: 850px;
      margin: 0 auto 12px auto;
      display: flex;
      gap: 10px;
      padding: 0 4px;
    }

    .feature-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .feature-btn svg {
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .feature-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .feature-btn.active {
      background-color: rgba(56, 189, 248, 0.1);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .feature-btn.active svg {
      opacity: 1;
      fill: var(--accent-color);
    }

    /* Input Card */
    .input-card {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .input-card:focus-within { border-color: var(--accent-color); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      line-height: 1.4;
      padding: 4px 0;
    }

    textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s;
    }

    .send-btn.stop { background: var(--danger-color); color: #ffffff; }
    .send-btn svg { width: 20px; height: 20px; fill: currentColor; }

    @media (max-width: 768px) {
      .menu-toggle-btn { display: flex; }
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .feature-btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar" class="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
    <div id="chat-history-list" class="chat-history-list"></div>
    <button id="delete-all-btn" class="delete-all-btn" onclick="deleteAllChats()">Delete All</button>
    <div class="sidebar-footer">JakeBoss AI</div>
  </aside>

  <div class="app-container">
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
        <div class="brand">
          <div class="brand-icon"></div>
          <h1>AI Assistant by <span class="glow-name">JakeBoss</span></h1>
        </div>
      </div>
      <div class="header-right">
        <div class="token-counter">Tokens: <span id="total-tokens">0</span></div>
      </div>
    </header>

    <div id="chat-box"></div>

    <div class="input-wrapper">
      
      <!-- Features Bar for Toggles -->
      <div class="features-bar">
        <button id="think-toggle-btn" class="feature-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M9 21c0 .5.4 1 1 1h4c.6 0 1-.5 1-1v-1H9v1zm3-19C6.5 2 2 6.5 2 12c0 2.4 1.1 4.5 2.8 6h14.4c1.7-1.5 2.8-3.6 2.8-6 0-5.5-4.5-10-10-10zm0 16H8v-1h8v1zm2.5-3H9.5v-1h5v1zm1.5-2.5h-8v-1h8v1z"/>
          </svg>
          Think
        </button>
        <button id="search-toggle-btn" class="feature-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          Web
        </button>
      </div>

      <div class="input-card">
        <textarea id="user-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-btn" class="send-btn" onclick="handleSendClick()">
          <svg id="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      baseUrl: "https://recycling-belts-paperback-jazz.trycloudflare.com", // Your Cloudflare Tunnel URL
      modelName: "qwen3.5:4b", // Your model
      keys: {
        sessions: 'jakeboss_sessions',
        tokens: 'jakeboss_total_tokens',
        thinking: 'jakeboss_enable_thinking',
        search: 'jakeboss_enable_search'
      }
    };

    // Internal state containing hidden user context
    let state = {
      sessions: JSON.parse(localStorage.getItem(CONFIG.keys.sessions) || '[]'),
      totalTokens: parseInt(localStorage.getItem(CONFIG.keys.tokens) || '0', 10),
      enableThinking: JSON.parse(localStorage.getItem(CONFIG.keys.thinking) ?? 'false'),
      enableSearch: JSON.parse(localStorage.getItem(CONFIG.keys.search) ?? 'false'),
      currentSessionId: null,
      abortController: null,
      isGenerating: false,
      userInfo: {
        ip: 'Unknown',
        location: 'Unknown Location',
        isp: 'Unknown ISP'
      }
    };

    // DOM References
    const elements = {
      sidebar: document.getElementById('sidebar'),
      sidebarOverlay: document.getElementById('sidebar-overlay'),
      chatHistoryList: document.getElementById('chat-history-list'),
      chatBox: document.getElementById('chat-box'),
      userInput: document.getElementById('user-input'),
      sendBtn: document.getElementById('send-btn'),
      totalTokens: document.getElementById('total-tokens'),
      btnThink: document.getElementById('think-toggle-btn'),
      btnSearch: document.getElementById('search-toggle-btn')
    };

    // Setup Marked with Highlight.js
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      langPrefix: 'hljs language-'
    });

    // Silently fetch IP and Location context behind the scenes
    async function fetchUserContextSilently() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        if (res.ok) {
          const data = await res.json();
          state.userInfo = {
            ip: data.ip || 'Unknown',
            location: `${data.city || ''}, ${data.region || ''}, ${data.country_name || ''}`.replace(/^, |, $/g, ''),
            isp: data.org || 'Unknown ISP'
          };
        }
      } catch (err) {
        // Silently fail if unreachable
      }
    }

    function updateToggleButtonUI(btn, isActive) {
      if (isActive) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    function init() {
      fetchUserContextSilently();

      updateToggleButtonUI(elements.btnThink, state.enableThinking);
      updateToggleButtonUI(elements.btnSearch, state.enableSearch);

      elements.btnThink.addEventListener('click', () => {
        state.enableThinking = !state.enableThinking;
        localStorage.setItem(CONFIG.keys.thinking, state.enableThinking);
        updateToggleButtonUI(elements.btnThink, state.enableThinking);
      });

      elements.btnSearch.addEventListener('click', () => {
        state.enableSearch = !state.enableSearch;
        localStorage.setItem(CONFIG.keys.search, state.enableSearch);
        updateToggleButtonUI(elements.btnSearch, state.enableSearch);
      });

      elements.userInput.addEventListener('input', autoResizeTextarea);
      elements.userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendClick();
        }
      });

      updateTotalTokensDisplay();

      if (state.sessions.length === 0) {
        startNewChat();
      } else {
        state.currentSessionId = state.sessions[0].id;
        renderSidebar();
        renderCurrentChat();
      }
    }

    function autoResizeTextarea() {
      elements.userInput.style.height = 'auto';
      elements.userInput.style.height = `${elements.userInput.scrollHeight}px`;
    }

    function toggleSidebar() {
      elements.sidebar.classList.toggle('open');
      elements.sidebarOverlay.classList.toggle('active');
    }

    function closeSidebar() {
      elements.sidebar.classList.remove('open');
      elements.sidebarOverlay.classList.remove('active');
    }

    function updateTotalTokensDisplay() {
      elements.totalTokens.textContent = state.totalTokens.toLocaleString();
      localStorage.setItem(CONFIG.keys.tokens, state.totalTokens.toString());
    }

    function saveSessions() {
      localStorage.setItem(CONFIG.keys.sessions, JSON.stringify(state.sessions));
    }

    function renderSidebar() {
      elements.chatHistoryList.innerHTML = '';
      state.sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === state.currentSessionId ? 'active' : ''}`;
        item.onclick = () => {
          state.currentSessionId = session.id;
          renderSidebar();
          renderCurrentChat();
          closeSidebar();
        };

        const titleSpan = document.createElement('span');
        titleSpan.className = 'history-title';
        titleSpan.textContent = session.title || 'Chat';

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-chat-btn';
        deleteBtn.textContent = '×';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChat(session.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(deleteBtn);
        elements.chatHistoryList.appendChild(item);
      });
    }

    function deleteChat(id) {
      state.sessions = state.sessions.filter(s => s.id !== id);
      saveSessions();
      if (state.currentSessionId === id) {
        startNewChat();
      } else {
        renderSidebar();
      }
    }

    function deleteAllChats() {
      state.sessions = [];
      saveSessions();
      startNewChat();
    }

    function startNewChat() {
      if (state.abortController) state.abortController.abort();
      const newSession = { id: Date.now().toString(), title: 'New Chat', messages: [] };
      state.sessions.unshift(newSession);
      state.currentSessionId = newSession.id;
      saveSessions();
      renderSidebar();
      renderCurrentChat();
      closeSidebar();
    }

    function renderCurrentChat() {
      elements.chatBox.innerHTML = '';
      const session = state.sessions.find(s => s.id === state.currentSessionId);

      if (!session || session.messages.length === 0) {
        elements.chatBox.innerHTML = `
          <div class="message-row">
            <div class="message bot">
              <div class="response-content">Hello! I am your personal assistant. How can I help you today?</div>
            </div>
          </div>`;
        return;
      }

      session.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = 'message-row';

        if (msg.role === 'user') {
          row.innerHTML = `<div class="message user"></div>`;
          row.querySelector('.message').textContent = msg.content;
        } else {
          row.innerHTML = `
            <div class="message bot">
              ${msg.thinking ? `<div class="thinking-block"><div class="thinking-label">Thinking...</div>${msg.thinking}</div>` : ''}
              <div class="response-content">${marked.parse(msg.content || '')}</div>
            </div>`;
        }
        elements.chatBox.appendChild(row);
      });
      
      scrollToBottom(true);
    }

    // Smart auto-scroll: only scrolls down if user is already at the bottom or forced
    function scrollToBottom(force = false) {
      const chatBox = elements.chatBox;
      const isNearBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 100;
      if (force || isNearBottom) {
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function handleSendClick() {
      const prompt = elements.userInput.value.trim();
      if (!prompt && !state.isGenerating) return;

      if (state.isGenerating && state.abortController) {
        state.abortController.abort();
        return;
      }

      sendMessage(prompt);
    }

    function generateSystemPrompt() {
      const now = new Date();
      
      const thinkingInstruction = state.enableThinking
        ? "INSTRUCTION: You are in THINKING MODE. You MUST show your detailed step-by-step reasoning process inside <think>...</think> tags before providing your final response."
        : "CRITICAL INSTRUCTION: You are in DIRECT MODE. You MUST NOT reason, deliberate, or use <think> tags. Do not explain your thought process. Output ONLY the immediate, direct, final answer.";

      return {
        role: 'system',
        content: `${thinkingInstruction}\n\nUser Context Information:\n- Current Local Date & Time: ${now.toString()}\n- Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n- IP Address: ${state.userInfo.ip}\n- Location: ${state.userInfo.location}\n- ISP: ${state.userInfo.isp}\n\nUse this context naturally if relevant.`
      };
    }

    async function sendMessage(prompt) {
      const session = state.sessions.find(s => s.id === state.currentSessionId);
      if (!session) return;

      if (session.messages.length === 0) {
        session.title = prompt.length > 20 ? prompt.substring(0, 20) + '...' : prompt;
      }

      session.messages.push({ role: 'user', content: prompt });
      saveSessions();
      renderSidebar();

      elements.userInput.value = '';
      autoResizeTextarea();

      const userRow = document.createElement('div');
      userRow.className = 'message-row';
      userRow.innerHTML = `<div class="message user"></div>`;
      userRow.querySelector('.message').textContent = prompt;
      elements.chatBox.appendChild(userRow);

      const botRow = document.createElement('div');
      botRow.className = 'message-row';
      botRow.innerHTML = `
        <div class="message bot">
          <div class="thinking-block" style="display: none;">
            <div class="thinking-label">Thinking...</div>
            <span class="thinking-content"></span>
          </div>
          <div class="response-content"></div>
        </div>`;
      elements.chatBox.appendChild(botRow);

      const thinkingBlock = botRow.querySelector('.thinking-block');
      const thinkingContent = botRow.querySelector('.thinking-content');
      const responseContent = botRow.querySelector('.response-content');
      
      // Force scroll down when sending a new message
      scrollToBottom(true);

      state.abortController = new AbortController();
      state.isGenerating = true;
      elements.sendBtn.classList.add('stop');

      let fullThinking = '';
      let fullResponse = '';

      const formattedMessages = [
        generateSystemPrompt(),
        ...session.messages.map(m => ({ role: m.role, content: m.content }))
      ];

      try {
        const response = await fetch(`${CONFIG.baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: CONFIG.modelName,
            messages: formattedMessages,
            stream: true,
            options: {
              temperature: state.enableThinking ? 0.7 : 0.1
            }
          }),
          signal: state.abortController.signal
        });

        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const parsed = JSON.parse(line);

              if (parsed.message?.thinking) {
                fullThinking += parsed.message.thinking;
                thinkingBlock.style.display = 'block';
                thinkingContent.textContent = fullThinking;
              }

              if (parsed.message?.content) {
                fullResponse += parsed.message.content;
                responseContent.innerHTML = marked.parse(fullResponse);
              }

              if (parsed.done) {
                state.totalTokens += (parsed.prompt_eval_count || 0) + (parsed.eval_count || 0);
                updateTotalTokensDisplay();
              }
              
              // Smart scroll check during stream chunks
              scrollToBottom();
            } catch (err) {}
          }
        }

        session.messages.push({ role: 'assistant', content: fullResponse, thinking: fullThinking });
        saveSessions();

      } catch (err) {
        if (err.name !== 'AbortError') {
          responseContent.textContent = `Error: ${err.message}`;
          responseContent.style.color = 'var(--danger-color)';
        }
      } finally {
        state.isGenerating = false;
        elements.sendBtn.classList.remove('stop');
        state.abortController = null;
      }
    }

    init();
  </script>
</body>
</html>
