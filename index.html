<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen Web Search Assistant</title>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --user-msg: #2b5278;
            --bot-msg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4da6ff;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .header {
            padding: 15px 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--bot-msg);
        }

        .controls {
            padding: 15px 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .options-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .search-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            resize: none;
            height: 40px;
            font-family: inherit;
        }

        textarea:focus {
            outline: 1px solid var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-indicator {
            font-size: 0.8rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>Qwen Search Chat</h2>
        <div id="status" class="status-indicator">Ready</div>
    </div>

    <div class="messages-container" id="messages"></div>

    <div class="controls">
        <div class="options-bar">
            <label class="search-toggle" title="Enable live DuckDuckGo web search">
                <input type="checkbox" id="search-enable-checkbox" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-label">🌐 Search</span>
            </label>
        </div>
        <div class="input-group">
            <textarea id="promptInput" placeholder="Type a message..." rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    const OLLAMA_ENDPOINT = 'http://localhost:11434/api/chat';
    const MODEL_NAME = 'qwen2.5';

    let conversationHistory = [];
    let currentAbortController = null;

    async function searchDuckDuckGo(query) {
        try {
            const proxyUrl = "https://api.allorigins.win/get?url=";
            const targetUrl = encodeURIComponent(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`);
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 4000);

            const res = await fetch(proxyUrl + targetUrl, { signal: controller.signal });
            clearTimeout(timeoutId);
            
            const data = await res.json();
            const parser = new DOMParser();
            const doc = parser.parseFromString(data.contents, 'text/html');
            const snippets = Array.from(doc.querySelectorAll('.result__snippet'))
                .slice(0, 3)
                .map(el => el.textContent.trim())
                .filter(text => text.length > 0);
            
            return snippets.length > 0 ? snippets.join('\n- ') : '';
        } catch (err) {
            console.warn("Search bypassed or failed:", err);
            return "";
        }
    }

    async function sendMessage() {
        const inputEl = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const isSearchEnabled = document.getElementById('search-enable-checkbox').checked;
        const statusEl = document.getElementById('status');
        const prompt = inputEl.value.trim();

        if (!prompt) return;

        inputEl.value = '';
        sendBtn.disabled = true;

        appendMessage('user', prompt);
        conversationHistory.push({ role: 'user', content: prompt });

        const assistantMsgEl = appendMessage('assistant', '');
        currentAbortController = new AbortController();

        try {
            let apiMessages = [...conversationHistory];
            let webContext = "";

            if (isSearchEnabled) {
                statusEl.textContent = '🔍 Searching web...';
                webContext = await searchDuckDuckGo(prompt);
                
                if (webContext) {
                    const systemContext = {
                        role: 'system',
                        content: `Live Web Search Results:\n- ${webContext}\n\nUse the above context if relevant.`
                    };
                    apiMessages.unshift(systemContext);
                }
            }

            statusEl.textContent = 'Thinking...';

            const response = await fetch(OLLAMA_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: currentAbortController.signal,
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: apiMessages,
                    stream: true
                })
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (!line.trim()) continue;
                    try {
                        const json = JSON.parse(line);
                        if (json.message?.content) {
                            fullText += json.message.content;
                            assistantMsgEl.textContent = fullText;
                            scrollToBottom();
                        }
                    } catch (e) {
                        console.error('Failed to parse JSON stream chunk:', e);
                    }
                }
            }

            conversationHistory.push({ role: 'assistant', content: fullText });

        } catch (err) {
            if (err.name !== 'AbortError') {
                assistantMsgEl.textContent = `[Error: ${err.message}]`;
            }
        } finally {
            statusEl.textContent = 'Ready';
            sendBtn.disabled = false;
            currentAbortController = null;
        }
    }

    function appendMessage(role, text) {
        const container = document.getElementById('messages');
        const msg = document.createElement('div');
        msg.className = `message ${role}`;
        msg.textContent = text;
        container.appendChild(msg);
        scrollToBottom();
        return msg;
    }

    function scrollToBottom() {
        const container = document.getElementById('messages');
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('promptInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
