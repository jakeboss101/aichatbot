<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JakeBoss AI Assistant</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #1e2430;
      --hover-bg: #21262d;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar Drawer (Gemini Style) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      z-index: 100;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 90;
      display: none;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.2s, border-color 0.2s;
      margin-bottom: 20px;
    }

    .new-chat-btn:hover {
      background-color: var(--hover-bg);
      border-color: var(--accent-color);
    }

    .new-chat-btn:active {
      transform: scale(0.98);
    }

    .history-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 0 12px 8px 12px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: background-color 0.2s, color 0.2s;
      position: relative;
      group: true;
    }

    .history-item:hover {
      background-color: var(--hover-bg);
      color: var(--text-main);
    }

    .history-item.active {
      background-color: var(--user-msg);
      color: var(--accent-color);
      font-weight: 500;
    }

    .history-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 8px;
    }

    .history-actions {
      display: none;
      align-items: center;
      gap: 4px;
    }

    .history-item:hover .history-actions,
    .history-item.active .history-actions {
      display: flex;
    }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-icon-btn:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-all-btn {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .clear-all-btn:hover {
      text-decoration: underline;
    }

    /* Main Container Shell */
    .app-container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* Header Bar */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .glow-name {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }

    /* Chat Area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message {
      max-width: 88%;
      padding: 16px 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-radius: 20px 20px 20px 4px;
      padding-left: 0;
    }

    /* Input Dock Area */
    .input-wrapper {
      padding: 12px 16px 16px 16px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .input-card {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 10px 12px 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-card:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      resize: none;
      max-height: 120px;
      height: 28px;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.2s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    @media (max-width: 850px) {
      .app-container {
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <aside id="sidebar" class="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New chat
    </button>
    
    <div class="history-label">Recent chats</div>
    <div id="history-list" class="history-list">
      <!-- Dynamically populated chat sessions -->
    </div>

    <div class="sidebar-footer">
      <span>Saved locally</span>
      <button class="clear-all-btn" onclick="clearAllChats()">Clear all</button>
    </div>
  </aside>

  <div class="app-container">
    <header>
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="brand">
        <div class="brand-icon"></div>
        <h1>AI Assistant by <span class="glow-name">JakeBoss</span></h1>
      </div>

      <div style="width: 24px;"></div>
    </header>

    <div id="chat-box">
      <div class="message-row">
        <div class="message bot">Hello! I am your personal assistant. How can I help you today?</div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-card">
        <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = "https://remote-basis-avatar-mpeg.trycloudflare.com";
    const modelName = "qwen3.5:4b";

    let chatSessions = [];
    let currentSessionId = null;
    let messagesHistory = [];

    const textarea = document.getElementById('user-input');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    // Initialize storage and load chats on start
    window.addEventListener('DOMContentLoaded', () => {
      loadSessionsFromStorage();
      if (chatSessions.length === 0) {
        startNewChat();
      } else {
        switchSession(chatSessions[0].id);
      }
    });

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function saveSessionsToStorage() {
      localStorage.setItem('jakeboss_chat_sessions', JSON.stringify(chatSessions));
      localStorage.setItem('jakeboss_current_session', currentSessionId);
    }

    function loadSessionsFromStorage() {
      try {
        const saved = localStorage.getItem('jakeboss_chat_sessions');
        if (saved) {
          chatSessions = JSON.parse(saved);
        }
        const savedCurrent = localStorage.getItem('jakeboss_current_session');
        if (savedCurrent) {
          currentSessionId = savedCurrent;
        }
      } catch (e) {
        chatSessions = [];
      }
    }

    function renderHistoryList() {
      const historyListEl = document.getElementById('history-list');
      historyListEl.innerHTML = '';

      chatSessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        item.onclick = () => switchSession(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'history-title';
        titleSpan.textContent = session.title || 'New Chat';

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'history-actions';
        actionsDiv.onclick = (e) => e.stopPropagation(); // Prevent switching when clicking actions

        // Rename Button
        const renameBtn = document.createElement('button');
        renameBtn.className = 'action-icon-btn';
        renameBtn.title = 'Rename chat';
        renameBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`;
        renameBtn.onclick = (e) => {
          e.stopPropagation();
          renameSession(session.id);
        };

        // Delete Button
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'action-icon-btn';
        deleteBtn.title = 'Delete chat';
        deleteBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteSession(session.id);
        };

        actionsDiv.appendChild(renameBtn);
        actionsDiv.appendChild(deleteBtn);

        item.appendChild(titleSpan);
        item.appendChild(actionsDiv);
        historyListEl.appendChild(item);
      });
    }

    function startNewChat() {
      const newId = 'session_' + Date.now();
      const newSession = {
        id: newId,
        title: 'New Chat',
        messages: []
      };

      chatSessions.unshift(newSession);
      switchSession(newId);
      if (window.innerWidth <= 850) {
        toggleSidebar();
      }
    }

    function switchSession(sessionId) {
      const session = chatSessions.find(s => s.id === sessionId);
      if (!session) return;

      currentSessionId = sessionId;
      messagesHistory = [...session.messages];

      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (messagesHistory.length === 0) {
        chatBox.innerHTML = `
          <div class="message-row">
            <div class="message bot">Hello! I am your personal assistant. How can I help you today?</div>
          </div>
        `;
      } else {
        messagesHistory.forEach(msg => {
          const row = document.createElement('div');
          row.className = 'message-row';
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
          msgDiv.textContent = msg.content;
          row.appendChild(msgDiv);
          chatBox.appendChild(row);
        });
      }

      chatBox.scrollTop = chatBox.scrollHeight;
      renderHistoryList();
      saveSessionsToStorage();
    }

    function renameSession(sessionId) {
      const session = chatSessions.find(s => s.id === sessionId);
      if (!session) return;

      const newTitle = prompt('Enter new chat title:', session.title);
      if (newTitle && newTitle.trim()) {
        session.title = newTitle.trim();
        renderHistoryList();
        saveSessionsToStorage();
      }
    }

    function deleteSession(sessionId) {
      chatSessions = chatSessions.filter(s => s.id !== sessionId);
      if (chatSessions.length === 0) {
        startNewChat();
      } else if (currentSessionId === sessionId) {
        switchSession(chatSessions[0].id);
      } else {
        renderHistoryList();
        saveSessionsToStorage();
      }
    }

    function clearAllChats() {
      if (confirm('Are you sure you want to delete all chat history?')) {
        chatSessions = [];
        startNewChat();
      }
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const chatBox = document.getElementById('chat-box');
      const prompt = inputEl.value.trim();

      if (!prompt) return;

      // If session title is still default, update it using the first prompt
      const currentSession = chatSessions.find(s => s.id === currentSessionId);
      if (currentSession && currentSession.title === 'New Chat') {
        currentSession.title = prompt.length > 28 ? prompt.substring(0, 28) + '...' : prompt;
        renderHistoryList();
      }

      messagesHistory.push({ role: 'user', content: prompt });

      const userRow = document.createElement('div');
      userRow.className = 'message-row';
      userRow.innerHTML = `<div class="message user"></div>`;
      userRow.querySelector('.message').textContent = prompt;
      chatBox.appendChild(userRow);

      inputEl.value = '';
      inputEl.style.height = '28px';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      const botRow = document.createElement('div');
      botRow.className = 'message-row';
      botRow.innerHTML = `<div class="message bot">...</div>`;
      chatBox.appendChild(botRow);
      const botMsgDiv = botRow.querySelector('.message');
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: modelName,
            messages: messagesHistory,
            stream: true
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullText = '';
        let streamBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          streamBuffer += decoder.decode(value, { stream: true });
          const lines = streamBuffer.split('\n');
          streamBuffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
              const parsed = JSON.parse(trimmed);
              
              if (parsed.message && parsed.message.thinking) {
                fullText += parsed.message.thinking;
                botMsgDiv.textContent = fullText;
                chatBox.scrollTop = chatBox.scrollHeight;
              }

              if (parsed.message && parsed.message.content) {
                fullText += parsed.message.content;
                botMsgDiv.textContent = fullText;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            } catch (e) {}
          }
        }

        if (streamBuffer.trim()) {
          try {
            const parsed = JSON.parse(streamBuffer.trim());
            if (parsed.message && (parsed.message.content || parsed.message.thinking)) {
              fullText += parsed.message.content || parsed.message.thinking;
              botMsgDiv.textContent = fullText;
            }
          } catch (e) {}
        }

        messagesHistory.push({ role: 'assistant', content: fullText });

        // Save into current session state
        if (currentSession) {
          currentSession.messages = [...messagesHistory];
          saveSessionsToStorage();
        }

      } catch (err) {
        botMsgDiv.textContent = `Connection error: ${err.message}`;
        botMsgDiv.style.color = '#ef4444';
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
