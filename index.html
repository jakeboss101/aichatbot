<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JakeBoss AI Assistant</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --panel-bg: #161b22;
      --border-color: #262c36;
      --user-msg: #1e293b;
      --bot-msg: transparent;
      --accent-color: #38bdf8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: #1e2430;
      --sidebar-width: 220px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Permanent Auto-Collapsing Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100%;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
      gap: 12px;
      z-index: 20;
      transition: transform 0.3s ease;
    }

    .sidebar.collapsed {
      transform: translateX(calc(-1 * var(--sidebar-width)));
      min-width: 0;
      width: 0;
      padding: 0;
      overflow: hidden;
      border: none;
    }

    .new-chat-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .new-chat-btn:active {
      transform: scale(0.98);
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s, color 0.15s;
    }

    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .history-item.active {
      background-color: var(--input-bg);
      color: var(--accent-color);
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    .sidebar-footer {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    /* Main Workspace Container */
    .app-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-width: 0;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(14, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .glow-name {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    }

    /* Chat Area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message {
      max-width: 88%;
      padding: 16px 20px;
      font-size: 1.05rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 20px 20px 4px 20px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-radius: 20px 20px 20px 4px;
      padding-left: 0;
    }

    /* Input Dock */
    .input-wrapper {
      padding: 12px 16px 16px 16px;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .input-card {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 10px 12px 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-card:focus-within {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 1.05rem;
      resize: none;
      max-height: 120px;
      height: 28px;
      line-height: 1.4;
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--accent-color);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.2s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn:disabled {
      background: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-width: 200px;
      }
      .sidebar {
        position: absolute;
        height: 100%;
      }
      .sidebar:not(.collapsed) {
        box-shadow: 5px 0 25px rgba(0,0,0,0.5);
      }
    }
  </style>
</head>
<body>

  <!-- Permanent Collapsible Sidebar -->
  <aside id="sidebar" class="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Chat
    </button>
    <div id="chat-history-list" class="chat-history-list"></div>
    <div class="sidebar-footer">JakeBoss AI</div>
  </aside>

  <!-- Main Workspace -->
  <div class="app-container">
    <header>
      <div class="header-left">
        <button class="menu-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="brand">
          <div class="brand-icon"></div>
          <h1>AI Assistant by <span class="glow-name">JakeBoss</span></h1>
        </div>
      </div>
    </header>

    <div id="chat-box"></div>

    <div class="input-wrapper">
      <div class="input-card">
        <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button id="send-btn" class="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const baseUrl = "https://idol-font-approach-adams.trycloudflare.com";
    const modelName = "huihui_ai/qwen2.5-abliterate:7b";

    let sessions = JSON.parse(localStorage.getItem('jakeboss_sessions') || '[]');
    let currentSessionId = null;

    const textarea = document.getElementById('user-input');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function saveSessions() {
      localStorage.setItem('jakeboss_sessions', JSON.stringify(sessions));
    }

    function renderSidebar() {
      const historyList = document.getElementById('chat-history-list');
      historyList.innerHTML = '';

      sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
        item.textContent = session.title || 'Chat Session';
        item.onclick = () => switchSession(session.id);
        historyList.appendChild(item);
      });
    }

    function startNewChat() {
      const newSession = {
        id: Date.now().toString(),
        title: 'New Chat',
        messages: []
      };
      sessions.unshift(newSession);
      currentSessionId = newSession.id;
      saveSessions();
      renderSidebar();
      renderCurrentChat();
    }

    function switchSession(id) {
      currentSessionId = id;
      renderSidebar();
      renderCurrentChat();
    }

    function renderCurrentChat() {
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      const session = sessions.find(s => s.id === currentSessionId);
      if (!session || session.messages.length === 0) {
        chatBox.innerHTML = `
          <div class="message-row">
            <div class="message bot">
              <div class="response-content">Hello! I am your personal assistant. How can I help you today?</div>
            </div>
          </div>
        `;
        return;
      }

      session.messages.forEach(msg => {
        const row = document.createElement('div');
        row.className = 'message-row';
        if (msg.role === 'user') {
          row.innerHTML = `<div class="message user"></div>`;
          row.querySelector('.message').textContent = msg.content;
        } else {
          row.innerHTML = `
            <div class="message bot">
              <div class="response-content"></div>
            </div>
          `;
          row.querySelector('.response-content').textContent = msg.content;
        }
        chatBox.appendChild(row);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const sendBtn = document.getElementById('send-btn');
      const chatBox = document.getElementById('chat-box');
      const prompt = inputEl.value.trim();

      if (!prompt) return;

      if (!currentSessionId) {
        startNewChat();
      }

      let session = sessions.find(s => s.id === currentSessionId);
      
      if (session.messages.length === 0) {
        session.title = prompt.length > 18 ? prompt.substring(0, 18) + '...' : prompt;
      }

      session.messages.push({ role: 'user', content: prompt });
      saveSessions();
      renderSidebar();

      // User Message UI
      const userRow = document.createElement('div');
      userRow.className = 'message-row';
      userRow.innerHTML = `<div class="message user"></div>`;
      userRow.querySelector('.message').textContent = prompt;
      chatBox.appendChild(userRow);

      inputEl.value = '';
      inputEl.style.height = '28px';
      inputEl.disabled = true;
      sendBtn.disabled = true;

      // Bot Message Shell
      const botRow = document.createElement('div');
      botRow.className = 'message-row';
      botRow.innerHTML = `
        <div class="message bot">
          <div class="response-content">...</div>
        </div>
      `;
      chatBox.appendChild(botRow);
      const responseContent = botRow.querySelector('.response-content');

      // Smart scroll check: only auto-scroll if user is already near bottom
      const isAtBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 80;
      if (isAtBottom) {
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      try {
        const apiMessages = session.messages.map(m => ({ role: m.role, content: m.content }));

        const response = await fetch(`${baseUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: modelName,
            messages: apiMessages,
            stream: true
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';
        let streamBuffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          streamBuffer += decoder.decode(value, { stream: true });
          const lines = streamBuffer.split('\n');
          streamBuffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
              const parsed = JSON.parse(trimmed);
              if (parsed.message && parsed.message.content) {
                if (fullResponse === '') responseContent.textContent = '';
                fullResponse += parsed.message.content;
                responseContent.textContent = fullResponse;
                
                const stayAtBottom = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight < 80;
                if (stayAtBottom) {
                  chatBox.scrollTop = chatBox.scrollHeight;
                }
              }
            } catch (e) {}
          }
        }

        if (streamBuffer.trim()) {
          try {
            const parsed = JSON.parse(streamBuffer.trim());
            if (parsed.message && parsed.message.content) {
              if (fullResponse === '') responseContent.textContent = '';
              fullResponse += parsed.message.content;
              responseContent.textContent = fullResponse;
            }
          } catch (e) {}
        }

        session.messages.push({
          role: 'assistant',
          content: fullResponse
        });
        saveSessions();

      } catch (err) {
        responseContent.textContent = `Connection error: ${err.message}`;
        responseContent.style.color = '#ef4444';
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Initialize session state on load
    if (sessions.length === 0) {
      startNewChat();
    } else {
      currentSessionId = sessions[0].id;
      renderSidebar();
      renderCurrentChat();
    }
  </script>
</body>
</html>
